<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1D3A2C">
<title>Bali Global Tran — Tour, Hotel Lembongan & Penjemputan Bandara</title>
<meta name="description" content="Bali Global Tran — travel agent lokal Bali: paket tour, hotel Nusa Lembongan, dan penjemputan bandara 24/7. Booking mudah via WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ DASAR ============ */
:root{
  --bg:#F7F2E7; --bg2:#EFE7D4; --white:#FFFDF8;
  --ink:#232D24; --muted:#6E7A6B;
  --green:#2E5641; --green-d:#1D3A2C; --green-x:#152B20;
  --terra:#BF5B32; --terra-d:#A3491F; --gold:#D9A13B;
  --line:#E2D8C3; --sand:#F3EEDF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans','Noto Sans SC','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--green);color:var(--sand)}
.container{width:min(1160px,92%);margin:0 auto}
section{padding:92px 0;scroll-margin-top:84px}
.lucide{width:18px;height:18px;stroke-width:2}
.ic-s{width:13px;height:13px}.ic-m{width:16px;height:16px}.ic-l{width:22px;height:22px}

/* ============ TIPOGRAFI UMUM ============ */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--terra)}
.eyebrow::before{content:"";width:30px;height:1.5px;background:var(--terra)}
h1,h2,h3,.serif{font-family:'Fraunces','Noto Serif SC','Noto Serif KR',serif;font-weight:600;letter-spacing:-.015em}
.sec-head h2{font-size:clamp(1.9rem,3.6vw,2.9rem);line-height:1.12;margin:14px 0 12px;max-width:640px}
.sec-head .sub{color:var(--muted);max-width:560px;font-size:15.5px}

/* ============ TOMBOL ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:999px;font-weight:700;font-size:14px;border:1.5px solid transparent;transition:.25s}
.btn.solid{background:var(--green);color:var(--sand)}
.btn.solid:hover{background:var(--green-d);transform:translateY(-2px)}
.btn.terra{background:var(--terra);color:#FFF3E6}
.btn.terra:hover{background:var(--terra-d);transform:translateY(-2px)}
.btn.ghost{border-color:rgba(35,45,36,.28);color:var(--ink);background:transparent}
.btn.ghost:hover{border-color:var(--ink)}
.btn.on-dark{border-color:rgba(243,238,223,.35);color:var(--sand)}
.btn.on-dark:hover{border-color:var(--sand)}
.btn.sm{padding:9px 16px;font-size:13px}
.btn.wide{width:100%}

/* ============ TOPBAR & NAV ============ */
.topbar{background:var(--green-d);color:var(--sand);font-size:12.5px;padding:8px 0}
.topbar .container{display:flex;justify-content:space-between;align-items:center;gap:14px}
.topbar .tb-left{display:flex;align-items:center;gap:8px;opacity:.9}
.topbar .tb-right{display:flex;align-items:center;gap:16px}
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid rgba(243,238,223,.3);color:var(--sand);padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;transition:.2s}
.lang-btn:hover{border-color:var(--sand)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(23,37,28,.18);padding:6px;min-width:190px;display:none;z-index:50}
.lang-menu.open{display:block}
.lang-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;padding:9px 13px;border:none;background:transparent;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink)}
.lang-menu button:hover{background:var(--bg2)}
.lang-menu button.on{color:var(--terra)}

.nav{position:sticky;top:0;z-index:55;background:rgba(247,242,231,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .container{display:flex;align-items:center;justify-content:space-between;height:72px;gap:20px}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:42px;height:42px;border-radius:13px;background:var(--green-d);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.logo-mark img{width:100%;height:100%;object-fit:contain;background:var(--white);padding:4px}
.logo-name{font-family:'Fraunces',serif;font-size:20px;font-weight:600;line-height:1.05}
.logo-sub{font-size:9.5px;letter-spacing:.3em;font-weight:700;color:var(--terra);text-transform:uppercase}
.nav-links{display:flex;gap:26px}
.nav-links a{font-size:14px;font-weight:600;color:var(--ink);position:relative;padding:4px 0}
.nav-links a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--terra);transition:.25s}
.nav-links a:hover::after{width:100%}
.nav-cta{display:flex;align-items:center;gap:12px}
.burger{display:none;background:none;border:none;color:var(--ink);padding:6px}

/* Drawer mobile */
.drawer{position:fixed;inset:0;background:var(--green-d);color:var(--sand);z-index:70;padding:26px;display:flex;flex-direction:column;transform:translateX(102%);transition:.4s cubic-bezier(.6,.05,.28,.99)}
.drawer.open{transform:translateX(0)}
.drawer-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.drawer-top .logo-mark{background:rgba(217,161,59,.15);color:var(--gold)}
.drawer nav{display:flex;flex-direction:column;gap:6px}
.drawer nav a{font-family:'Fraunces',serif;font-size:30px;padding:9px 0;border-bottom:1px solid rgba(243,238,223,.12)}
.drawer .d-lang{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:24px}
.drawer .d-lang button{background:transparent;border:1px solid rgba(243,238,223,.3);color:var(--sand);padding:8px 15px;border-radius:999px;font-size:13px;font-weight:600}
.drawer .d-lang button.on{background:var(--gold);border-color:var(--gold);color:var(--green-x)}
.icon-btn{background:transparent;border:1px solid rgba(243,238,223,.3);color:var(--sand);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ============ HERO ============ */
.hero{padding:70px 0 96px;position:relative}
.hero .container{display:grid;grid-template-columns:1.04fr .96fr;gap:56px;align-items:center}
.hero-chip{display:inline-flex;align-items:center;gap:9px;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:700;color:var(--green-d)}
.hero-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--terra);flex:none}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.4rem);line-height:1.03;margin:20px 0 22px}
.hero h1 .hl{color:var(--terra);font-style:italic;font-weight:500}
.hero .lead{color:var(--muted);font-size:16.5px;max-width:520px}
.hero-cta{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:50px}
.hstat{border-left:1.5px solid var(--line);padding-left:14px}
.hstat b{display:block;font-family:'Fraunces',serif;font-size:27px;font-weight:600;color:var(--green-d);line-height:1.1}
.hstat span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.hero-visual{position:relative}
.orb{position:absolute;top:-46px;right:-70px;width:330px;height:330px;border-radius:50%;background:var(--bg2);z-index:0}
.arch-main{position:relative;z-index:1;width:76%;margin-left:auto;aspect-ratio:4/5;border-radius:999px 999px 26px 26px;overflow:hidden;border:8px solid var(--white);box-shadow:0 30px 60px rgba(23,37,28,.18)}
.arch-small{position:absolute;z-index:2;left:-6px;bottom:-38px;width:47%;aspect-ratio:5/4;border-radius:24px;overflow:hidden;border:8px solid var(--white);box-shadow:0 22px 44px rgba(23,37,28,.2)}
.float-card{position:absolute;z-index:3;top:38px;left:-14px;display:flex;align-items:center;gap:11px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 17px;box-shadow:0 16px 34px rgba(23,37,28,.14)}
.float-card .fic{width:36px;height:36px;border-radius:11px;background:var(--green-d);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.float-card b{font-size:13px;display:block;line-height:1.3}
.float-card span{font-size:11.5px;color:var(--muted)}
.float-chip{position:absolute;z-index:3;bottom:44px;right:8px;display:flex;align-items:center;gap:8px;background:var(--green-d);color:var(--sand);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;box-shadow:0 14px 30px rgba(23,37,28,.25)}
.float-chip .lucide{color:var(--gold)}

/* ============ MARQUEE ============ */
.marquee{background:var(--green-d);color:var(--sand);overflow:hidden;border-top:1px solid var(--green-x)}
.mq-track{display:flex;width:max-content;gap:52px;padding:15px 0;animation:mq 30s linear infinite}
.mq-track span{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700;letter-spacing:.22em;white-space:nowrap}
.mq-track .lucide{color:var(--gold);width:15px;height:15px}
@keyframes mq{to{transform:translateX(-50%)}}

/* ============ DESTINASI ============ */
.tabs{display:inline-flex;gap:4px;background:var(--bg2);padding:6px;border-radius:999px;margin-top:30px;flex-wrap:wrap}
.tab{border:none;background:transparent;padding:9px 19px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:7px;transition:.25s}
.tab.on{background:var(--green-d);color:var(--sand)}
.dgrid{margin-top:44px;columns:3;column-gap:20px}
.dcard{break-inside:avoid;margin-bottom:20px;background:var(--white);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .35s,box-shadow .35s;display:flex;flex-direction:column}
.dcard:hover{transform:translateY(-5px);box-shadow:0 22px 44px rgba(23,37,28,.13)}
.dcard figure{position:relative;overflow:hidden;flex:none}
.dcard figure img{transition:transform .6s ease}
.dcard:hover figure img{transform:scale(1.06)}
.cat{position:absolute;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;background:rgba(21,43,32,.82);color:var(--sand);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 11px;border-radius:999px;backdrop-filter:blur(4px)}
.cat .lucide{width:11px;height:11px;color:var(--gold)}
.dbody{padding:18px 20px 20px}
.darea{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--terra);letter-spacing:.05em;text-transform:uppercase}
.darea .lucide{width:12px;height:12px}
.dbody h3{font-size:21px;margin:8px 0 7px}
.dbody p{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmore{display:inline-flex;align-items:center;gap:6px;margin-top:13px;font-size:13px;font-weight:700;color:var(--terra)}
.dmore .lucide{width:14px;height:14px;transition:.25s}
.dcard:hover .dmore .lucide{transform:translate(2px,-2px)}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;z-index:75;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal .backdrop{position:absolute;inset:0;background:rgba(18,28,21,.6);backdrop-filter:blur(5px)}
.sheet{position:relative;width:min(720px,100%);max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:26px;animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.sheet figure{height:280px;position:relative}
.sheet .xbtn{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,253,248,.92);color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2}
.sheet .mbody{padding:26px 30px 30px}
.sheet h3{font-size:30px;margin:8px 0 4px}
.sheet .spots{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.spot{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--white);padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600}
.spot .lucide{width:13px;height:13px;color:var(--green)}
.sheet .actions{display:flex;gap:12px;flex-wrap:wrap}

/* ============ PAKET ============ */
.plist{margin-top:44px;border-bottom:1px solid var(--line)}
.prow{border-top:1px solid var(--line)}
.phead{display:grid;grid-template-columns:58px 1fr auto 30px;gap:20px;align-items:center;padding:26px 6px;cursor:pointer;transition:.2s}
.phead:hover{background:rgba(255,253,248,.7)}
.pnum{font-family:'Fraunces',serif;font-style:italic;font-size:19px;color:var(--terra)}
.pname{font-size:clamp(19px,2.4vw,26px);line-height:1.15}
.pmeta{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px}
.pprice{text-align:right}
.pprice b{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:var(--green-d);white-space:nowrap}
.pprice span{display:block;font-size:11.5px;color:var(--muted)}
.pchev{color:var(--muted);transition:.35s;display:flex;justify-content:center}
.prow.open .pchev{transform:rotate(45deg);color:var(--terra)}
.pbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.4,0,.2,1)}
.prow.open .pbody{grid-template-rows:1fr}
.pbody>div{overflow:hidden}
.pinner{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;padding:4px 6px 32px 84px}
.itin-t{font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.itin{list-style:none}
.itin li{display:flex;gap:12px;align-items:baseline;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.itin .n{font-family:'Fraunces',serif;font-style:italic;color:var(--terra);font-size:14px;flex:none;width:20px}
.incl-box{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:20px 22px;height:100%;display:flex;flex-direction:column;gap:14px}
.incl-box .row{display:flex;gap:10px;font-size:13.5px;color:var(--ink)}
.incl-box .row .lucide{color:var(--green);flex:none;margin-top:3px;width:15px;height:15px}
.incl-box .btn{margin-top:auto}

/* ============ LEMBONGAN (SECTION GELAP) ============ */
.lembongan{background:var(--green-d);color:var(--sand)}
.lembongan .eyebrow{color:var(--gold)}
.lembongan .eyebrow::before{background:var(--gold)}
.lembongan .sec-head h2{color:var(--sand)}
.lemb-top{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;margin-top:10px}
.lemb-desc{color:rgba(243,238,223,.75);font-size:15.5px;max-width:520px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:22px 26px;margin-top:34px}
.act{display:flex;gap:13px}
.act .aic{width:40px;height:40px;flex:none;border-radius:12px;background:rgba(217,161,59,.15);border:1px solid rgba(217,161,59,.35);color:var(--gold);display:flex;align-items:center;justify-content:center}
.act b{font-size:14.5px;display:block}
.act p{font-size:12.5px;color:rgba(243,238,223,.65);line-height:1.5}
.lemb-arch{aspect-ratio:4/5;border-radius:999px 999px 26px 26px;overflow:hidden;border:8px solid rgba(243,238,223,.12);position:relative}
.stays{margin-top:74px}
.stays-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:24px}
.stays-head h3{font-size:clamp(20px,2.6vw,26px);color:var(--sand)}
.stays-grid{display:grid;grid-template-columns:1.08fr 1fr;gap:20px}
.stay-feat{grid-row:span 2;background:var(--white);color:var(--ink);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.stay-feat figure{height:250px;position:relative;flex:none}
.stay-feat .dbody{padding:22px 24px 24px;display:flex;flex-direction:column;flex:1}
.pop-tag{position:absolute;top:14px;right:14px;background:var(--gold);color:var(--green-x);font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.stay-sm{background:var(--white);color:var(--ink);border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center}
.stay-sm figure{width:104px;height:104px;border-radius:15px;overflow:hidden;flex:none}
.stay-sm h4{font-family:'Fraunces',serif;font-size:17px;font-weight:600}
.stay-sm .darea{margin:3px 0 5px}
.stay-sm p{font-size:12px;color:var(--muted);line-height:1.45}
.stay-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:14px}
.price b{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--green-d)}
.price span{font-size:12px;color:var(--muted)}
.stay-sm .stay-foot{padding-top:8px;margin-top:6px}
.stay-sm .price b{font-size:17px}

/* ============ TRANSPORT ============ */
.transport{background:var(--bg2)}
.tr-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-top:44px;align-items:start}
.step{display:flex;gap:20px;position:relative;padding-bottom:34px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:21px;top:46px;bottom:4px;width:1.5px;background-image:linear-gradient(var(--terra) 40%,transparent 40%);background-size:1.5px 8px}
.step:last-child::before{display:none}
.step .num{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--terra);color:var(--terra);font-family:'Fraunces',serif;font-style:italic;font-size:18px;display:flex;align-items:center;justify-content:center;background:var(--bg2)}
.step b{font-size:16.5px;display:block;margin-top:8px}
.step p{font-size:13.5px;color:var(--muted);margin-top:4px}
.rates{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:26px 28px;box-shadow:0 20px 44px rgba(23,37,28,.08)}
.rates-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.rates-head .ric{width:40px;height:40px;border-radius:12px;background:var(--green-d);color:var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
.rates-head b{font-size:16px}
.route{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line)}
.route .rn{font-weight:700;font-size:14.5px}
.route .rt{font-size:12px;color:var(--muted);margin-left:8px;font-weight:600}
.route .rp{font-family:'Fraunces',serif;font-size:16.5px;color:var(--terra);white-space:nowrap}
.rates .note{display:flex;gap:9px;font-size:12.5px;color:var(--muted);margin:16px 0 20px}
.rates .note .lucide{color:var(--green);flex:none;margin-top:2px;width:15px;height:15px}

/* ============ FAQ ============ */
.faq-wrap{max-width:820px;margin:40px auto 0}
.frow{border-top:1px solid var(--line)}
.frow:last-child{border-bottom:1px solid var(--line)}
.fq{width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;background:none;border:none;text-align:left;padding:22px 6px;font-size:16.5px;font-weight:700;color:var(--ink)}
.fq .lucide{flex:none;color:var(--terra);transition:.35s;width:20px;height:20px}
.frow.open .fq .lucide{transform:rotate(45deg)}
.fa{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.frow.open .fa{grid-template-rows:1fr}
.fa>div{overflow:hidden}
.fa p{padding:0 6px 24px;color:var(--muted);font-size:14.5px;max-width:680px}

/* ============ BOOKING ============ */
.booking{background:var(--bg)}
.bk-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;margin-top:44px;align-items:start}
.bk-form{background:var(--green-d);border-radius:28px;padding:38px;color:var(--sand)}
.bk-form.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 5px var(--gold)}}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.fld label{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,238,223,.65);margin-bottom:8px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--white);border:1.5px solid transparent;border-radius:13px;padding:13px 15px;font-family:inherit;font-size:14px;color:var(--ink);transition:.2s;appearance:none}
.fld select{background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%23232D24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>');background-repeat:no-repeat;background-position:right 14px center;padding-right:40px}
.fld textarea{resize:vertical;min-height:88px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold)}
.bk-form .btn{margin-top:8px}
.bk-hint{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:rgba(243,238,223,.6);margin-top:14px;text-align:center}
.bk-side{display:flex;flex-direction:column;gap:16px}
.wa-card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;align-items:center;gap:18px}
.wa-card .wic{width:54px;height:54px;flex:none;border-radius:16px;background:#E7F0E4;color:var(--green);display:flex;align-items:center;justify-content:center}
.wa-card .lucide{width:25px;height:25px}
.wa-card b{font-family:'Fraunces',serif;font-size:23px;font-weight:600;display:block;line-height:1.2}
.wa-card span{font-size:12.5px;color:var(--muted)}
.wa-card .btn{margin-left:auto;flex:none}
.side-row{display:flex;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px 20px;align-items:flex-start}
.side-row .sic{width:38px;height:38px;flex:none;border-radius:11px;background:var(--bg2);color:var(--terra);display:flex;align-items:center;justify-content:center}
.side-row b{font-size:14.5px;display:block}
.side-row p{font-size:12.5px;color:var(--muted)}

/* ============ FOOTER ============ */
footer{background:var(--green-x);color:rgba(243,238,223,.8);padding:66px 0 26px}
.ft-grid{display:grid;grid-template-columns:1.4fr 1fr 1.1fr;gap:44px;padding-bottom:44px;border-bottom:1px solid rgba(243,238,223,.12)}
.ft-brand p{font-size:13.5px;color:rgba(243,238,223,.6);margin-top:14px;max-width:300px}
.ft-brand .logo-mark{background:rgba(217,161,59,.15);color:var(--gold)}
.ft-brand .logo-name,.ft-brand .logo-sub{color:var(--sand)}
footer h4{color:var(--sand);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px;font-weight:800}
.ft-links{display:flex;flex-direction:column;gap:11px}
.ft-links a{font-size:14px;transition:.2s}
.ft-links a:hover{color:var(--gold)}
.ft-contact{display:flex;flex-direction:column;gap:13px;font-size:13.5px}
.ft-contact div{display:flex;gap:11px;align-items:flex-start}
.ft-contact .lucide{color:var(--gold);flex:none;margin-top:3px;width:15px;height:15px}
.ft-bottom{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:24px;font-size:12.5px;color:rgba(243,238,223,.45)}

/* ============ CHAT AI ============ */
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;background:var(--terra);color:#FFF3E6;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(191,91,50,.42);z-index:65;transition:.3s}
.fab:hover{transform:scale(1.08)}
.fab .lucide{width:25px;height:25px}
.fab .ping{position:absolute;top:4px;right:4px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2.5px solid var(--bg)}
.cpanel{position:fixed;right:22px;bottom:94px;width:min(384px,calc(100vw - 30px));height:min(560px,calc(100dvh - 132px));background:var(--bg);border:1px solid var(--line);border-radius:22px;box-shadow:0 32px 64px rgba(21,43,32,.28);display:flex;flex-direction:column;overflow:hidden;z-index:64;opacity:0;pointer-events:none;transform:translateY(16px) scale(.97);transition:.32s cubic-bezier(.3,1.2,.4,1)}
.cpanel.open{opacity:1;pointer-events:auto;transform:none}
.chead{background:var(--green-d);color:var(--sand);padding:15px 18px;display:flex;align-items:center;gap:12px;flex:none}
.chead .cav{width:40px;height:40px;border-radius:13px;background:var(--gold);color:var(--green-x);display:flex;align-items:center;justify-content:center;flex:none}
.chead b{font-family:'Fraunces',serif;font-size:16.5px;font-weight:600;display:block;line-height:1.15}
.chead .st{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(243,238,223,.7)}
.chead .st .d{width:7px;height:7px;border-radius:50%;background:#7BC47F;animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.4}}
.chead .cwa{margin-left:auto;width:38px;height:38px;border-radius:12px;border:1px solid rgba(243,238,223,.3);background:transparent;color:var(--sand);display:flex;align-items:center;justify-content:center;transition:.2s}
.chead .cwa:hover{background:rgba(243,238,223,.12)}
.cbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.msg{max-width:84%;padding:11px 14px;border-radius:16px;font-size:13.5px;white-space:pre-line;line-height:1.55;animation:pop .3s ease}
.msg.bot{background:var(--white);border:1px solid var(--line);border-top-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--green);color:var(--sand);border-top-right-radius:5px;align-self:flex-end}
.msg.typing{display:flex;gap:5px;align-items:center;padding:15px 16px}
.msg.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.msg.typing i:nth-child(2){animation-delay:.18s}.msg.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{50%{opacity:.25;transform:translateY(-2px)}}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;flex:none}
.qchip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--green-d);transition:.2s}
.qchip:hover{background:var(--green-d);color:var(--sand);border-color:var(--green-d)}
.cinput{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line);background:var(--white);flex:none}
.cinput input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:11px 17px;font-family:inherit;font-size:13.5px;color:var(--ink)}
.cinput input:focus{outline:none;border-color:var(--gold)}
.cinput button{width:42px;height:42px;flex:none;border-radius:50%;border:none;background:var(--terra);color:#FFF3E6;display:flex;align-items:center;justify-content:center;transition:.2s}
.cinput button:hover{background:var(--terra-d)}

/* ============ TOAST & REVEAL ============ */
.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-90px);background:var(--ink);color:var(--sand);padding:13px 22px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:85;transition:.45s cubic-bezier(.3,1.2,.4,1);display:flex;align-items:center;gap:9px;box-shadow:0 18px 40px rgba(0,0,0,.25);max-width:calc(100vw - 40px)}
.toast.show{transform:translate(-50%,0)}
.toast .lucide{color:var(--gold);width:16px;height:16px;flex:none}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}

/* ============ RESPONSIVE ============ */
@media(max-width:1020px){
  .nav-links{display:none}
  .burger{display:flex}
  .nav .btn{display:none}
  .hero .container{grid-template-columns:1fr;gap:64px}
  .hero-visual{max-width:520px;margin:0 auto;width:100%}
  .hero-stats{grid-template-columns:repeat(2,1fr);gap:24px}
  .dgrid{columns:2}
  .pinner{grid-template-columns:1fr;padding-left:6px;gap:24px}
  .lemb-top{grid-template-columns:1fr;gap:48px}
  .lemb-arch{max-width:480px}
  .stays-grid{grid-template-columns:1fr}
  .stay-feat{grid-row:auto}
  .tr-grid{grid-template-columns:1fr;gap:48px}
  .bk-grid{grid-template-columns:1fr}
  .ft-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  section{padding:70px 0}
  .topbar .tb-left{display:none}
  .topbar .container{justify-content:flex-end}
  .dgrid{columns:1}
  .dcard figure{height:230px!important}
  .dcard{margin-bottom:16px}
  .phead{grid-template-columns:1fr 26px;gap:10px;padding:20px 2px}
  .pnum{display:none}
  .pprice{grid-column:1;text-align:left;margin-top:2px}
  .pprice span{display:inline;margin-left:6px}
  .pchev{grid-row:1;grid-column:2}
  .acts{grid-template-columns:1fr}
  .bk-form{padding:26px 22px}
  .frow2{grid-template-columns:1fr}
  .wa-card{flex-wrap:wrap}
  .wa-card .btn{margin-left:0;width:100%}
  .ft-grid{grid-template-columns:1fr;gap:32px}
  .float-card{left:0;padding:10px 13px}
  .float-card span{display:none}
  .sheet figure{height:200px}
  .sheet .mbody{padding:22px}
}
</style>
</head>
<body>

<!-- ================= TOPBAR ================= -->
<div class="topbar">
  <div class="container">
    <div class="tb-left">
      <i data-lucide="shield-check" class="ic-s"></i>
      <span data-i18n="tag"></span>
    </div>
    <div class="tb-right">
      <span style="display:flex;align-items:center;gap:7px;opacity:.9">
        <i data-lucide="clock" class="ic-s"></i><span data-i18n="hours"></span>
      </span>
      <div class="lang">
        <button class="lang-btn" id="langBtn" aria-label="Language">
          <i data-lucide="globe" class="ic-s"></i>
          <span id="langCur">ID</span>
          <i data-lucide="chevron-down" class="ic-s"></i>
        </button>
        <div class="lang-menu" id="langMenu"></div>
      </div>
    </div>
  </div>
</div>

<!-- ================= NAVBAR ================= -->
<header class="nav">
  <div class="container">
    <a class="logo" href="#beranda">
      <span class="logo-mark"><i data-lucide="palmtree" class="ic-l"></i></span>
      <span>
        <span class="logo-name">Bali Global Tran</span><br>
        <span class="logo-sub" data-i18n="brand"></span>
      </span>
    </a>
    <nav class="nav-links">
      <a href="#beranda" data-i18n="navHome"></a>
      <a href="#destinasi" data-i18n="navDest"></a>
      <a href="#paket" data-i18n="navPack"></a>
      <a href="#lembongan" data-i18n="navLemb"></a>
      <a href="#transport" data-i18n="navTrans"></a>
      <a href="#faq" data-i18n="navFaq"></a>
      <a href="#booking" data-i18n="navContact"></a>
    </nav>
    <div class="nav-cta">
      <a href="#booking" class="btn terra sm" data-i18n="navBook"></a>
      <button class="burger" id="burger" aria-label="Menu"><i data-lucide="menu" class="ic-l"></i></button>
    </div>
  </div>
</header>

<!-- Drawer mobile -->
<div class="drawer" id="drawer">
  <div class="drawer-top">
    <a class="logo" href="#beranda">
      <span class="logo-mark"><i data-lucide="palmtree" class="ic-l"></i></span>
      <span class="logo-name" style="color:var(--sand)">Bali Global Tran</span>
    </a>
    <button class="icon-btn" id="drawerClose" aria-label="Tutup"><i data-lucide="x" class="ic-l"></i></button>
  </div>
  <nav>
    <a href="#beranda" data-i18n="navHome"></a>
    <a href="#destinasi" data-i18n="navDest"></a>
    <a href="#paket" data-i18n="navPack"></a>
    <a href="#lembongan" data-i18n="navLemb"></a>
    <a href="#transport" data-i18n="navTrans"></a>
    <a href="#faq" data-i18n="navFaq"></a>
    <a href="#booking" data-i18n="navContact"></a>
  </nav>
  <div class="d-lang" id="drawerLang"></div>
</div>

<main>
<!-- ================= HERO ================= -->
<section class="hero" id="beranda">
  <div class="container">
    <div class="rv in">
      <span class="hero-chip"><span class="dot"></span><span data-i18n="heroEyebrow"></span></span>
      <h1><span data-i18n="heroL1"></span><br><span class="hl" data-i18n="heroL2"></span><br><span data-i18n="heroL3"></span></h1>
      <p class="lead" data-i18n="heroDesc"></p>
      <div class="hero-cta">
        <a href="#paket" class="btn solid"><span data-i18n="ctaPack"></span><i data-lucide="arrow-right" class="ic-m"></i></a>
        <a href="#" class="btn ghost wa-open"><i data-lucide="message-circle" class="ic-m"></i><span data-i18n="ctaWa"></span></a>
      </div>
      <div class="hero-stats">
        <div class="hstat"><b>12+</b><span data-i18n="st1"></span></div>
        <div class="hstat"><b>9</b><span data-i18n="st2"></span></div>
        <div class="hstat"><b>4</b><span data-i18n="st3"></span></div>
        <div class="hstat"><b>24/7</b><span data-i18n="st4"></span></div>
      </div>
    </div>
    <div class="hero-visual rv in" style="transition-delay:.15s">
      <div class="orb"></div>
      <div class="arch-main"><img src="https://picsum.photos/seed/bgt-hero/900/1120.jpg" alt="Bali"></div>
      <div class="arch-small"><img src="https://picsum.photos/seed/bgt-raft/560/450.jpg" alt="Bali"></div>
      <div class="float-card">
        <span class="fic"><i data-lucide="plane" class="ic-m"></i></span>
        <span><b data-i18n="badge24"></b><span>Ngurah Rai</span></span>
      </div>
      <div class="float-chip"><i data-lucide="fish" class="ic-m"></i>Manta Point</div>
    </div>
  </div>
</section>

<!-- ================= MARQUEE ================= -->
<div class="marquee" aria-hidden="true">
  <div class="mq-track" id="mqTrack"></div>
</div>

<!-- ================= DESTINASI ================= -->
<section id="destinasi">
  <div class="container">
    <div class="sec-head rv">
      <span class="eyebrow" data-i18n="destEyebrow"></span>
      <h2 data-i18n="destTitle"></h2>
      <p class="sub" data-i18n="destSub"></p>
      <div class="tabs" id="tabs">
        <button class="tab on" data-f="all" data-i18n="tabAll"></button>
        <button class="tab" data-f="sea"><i data-lucide="waves" class="ic-s"></i><span data-i18n="tabSea"></span></button>
        <button class="tab" data-f="land"><i data-lucide="trees" class="ic-s"></i><span data-i18n="tabLand"></span></button>
        <button class="tab" data-f="mount"><i data-lucide="mountain" class="ic-s"></i><span data-i18n="tabMount"></span></button>
      </div>
    </div>
    <div class="dgrid" id="dgrid"></div>
  </div>
</section>

<!-- ================= PAKET TOUR ================= -->
<section id="paket">
  <div class="container">
    <div class="sec-head rv">
      <span class="eyebrow" data-i18n="pkgEyebrow"></span>
      <h2 data-i18n="pkgTitle"></h2>
      <p class="sub" data-i18n="pkgSub"></p>
    </div>
    <div class="plist rv" id="plist"></div>
  </div>
</section>

<!-- ================= LEMBONGAN ================= -->
<section class="lembongan" id="lembongan">
  <div class="container">
    <div class="lemb-top">
      <div class="rv">
        <span class="eyebrow" data-i18n="lembEyebrow"></span>
        <h2 style="font-size:clamp(1.8rem,3.4vw,2.7rem);line-height:1.12;margin:14px 0 14px" data-i18n="lembTitle"></h2>
        <p class="lemb-desc" data-i18n="lembDesc"></p>
        <div class="acts">
          <div class="act"><span class="aic"><i data-lucide="fish" class="ic-m"></i></span><span><b data-i18n="a1t"></b><p data-i18n="a1d"></p></span></div>
          <div class="act"><span class="aic"><i data-lucide="sailboat" class="ic-m"></i></span><span><b data-i18n="a2t"></b><p data-i18n="a2d"></p></span></div>
          <div class="act"><span class="aic"><i data-lucide="waves" class="ic-m"></i></span><span><b data-i18n="a3t"></b><p data-i18n="a3d"></p></span></div>
          <div class="act"><span class="aic"><i data-lucide="shell" class="ic-m"></i></span><span><b data-i18n="a4t"></b><p data-i18n="a4d"></p></span></div>
        </div>
      </div>
      <div class="lemb-arch rv" style="transition-delay:.15s">
        <img src="https://picsum.photos/seed/bgt-lembongan/800/1000.jpg" alt="Nusa Lembongan">
      </div>
    </div>
    <div class="stays rv">
      <div class="stays-head">
        <h3 data-i18n="stayTitle"></h3>
        <a href="#" class="wa-open" style="display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--gold)">
          <i data-lucide="message-circle" class="ic-m"></i><span data-i18n="ctaWa"></span>
        </a>
      </div>
      <div class="stays-grid" id="stays"></div>
    </div>
  </div>
</section>

<!-- ================= TRANSPORT / PENJEMPUTAN ================= -->
<section class="transport" id="transport">
  <div class="container">
    <div class="sec-head rv">
      <span class="eyebrow" data-i18n="trEyebrow"></span>
      <h2 data-i18n="trTitle"></h2>
      <p class="sub" data-i18n="trDesc"></p>
    </div>
    <div class="tr-grid">
      <div class="rv">
        <div class="step">
          <span class="num">1</span>
          <span><b data-i18n="s1t"></b><p data-i18n="s1d"></p></span>
        </div>
        <div class="step">
          <span class="num">2</span>
          <span><b data-i18n="s2t"></b><p data-i18n="s2d"></p></span>
        </div>
        <div class="step">
          <span class="num">3</span>
          <span><b data-i18n="s3t"></b><p data-i18n="s3d"></p></span>
        </div>
      </div>
      <div class="rates rv" style="transition-delay:.12s">
        <div class="rates-head">
          <span class="ric"><i data-lucide="plane" class="ic-m"></i></span>
          <b data-i18n="rateT"></b>
        </div>
        <div>
          <div class="route"><span><span class="rn">Kuta / Seminyak</span><span class="rt">±25 min</span></span><span class="rp">Rp 150.000</span></div>
          <div class="route"><span><span class="rn">Canggu</span><span class="rt">±40 min</span></span><span class="rp">Rp 200.000</span></div>
          <div class="route"><span><span class="rn">Nusa Dua</span><span class="rt">±30 min</span></span><span class="rp">Rp 175.000</span></div>
          <div class="route"><span><span class="rn">Ubud</span><span class="rt">±75 min</span></span><span class="rp">Rp 300.000</span></div>
          <div class="route"><span><span class="rn">Bedugul</span><span class="rt">±2 h</span></span><span class="rp">Rp 450.000</span></div>
          <div class="route"><span><span class="rn">Sidemen</span><span class="rt">±2,5 h</span></span><span class="rp">Rp 550.000</span></div>
        </div>
        <p class="note"><i data-lucide="shield-check"></i><span data-i18n="rateNote"></span></p>
        <button class="btn terra wide" id="rateCta"><i data-lucide="plane" class="ic-m"></i><span data-i18n="rateCta"></span></button>
      </div>
    </div>
  </div>
</section>

<!-- ================= FAQ ================= -->
<section id="faq">
  <div class="container">
    <div class="sec-head rv" style="text-align:center;max-width:640px;margin:0 auto">
      <span class="eyebrow" data-i18n="faqEyebrow"></span>
      <h2 style="margin-left:auto;margin-right:auto" data-i18n="faqTitle"></h2>
    </div>
    <div class="faq-wrap rv" id="flist"></div>
  </div>
</section>

<!-- ================= BOOKING ================= -->
<section id="booking">
  <div class="container">
    <div class="sec-head rv">
      <span class="eyebrow" data-i18n="bkEyebrow"></span>
      <h2 data-i18n="bkTitle"></h2>
      <p class="sub" data-i18n="bkDesc"></p>
    </div>
    <div class="bk-grid">
      <form class="bk-form rv" id="bkForm" novalidate>
        <div class="frow2">
          <div class="fld"><label data-i18n="bkName"></label><input id="fName" data-i18n-ph="phName"></div>
          <div class="fld"><label data-i18n="bkPhone"></label><input id="fPhone" inputmode="tel" placeholder="0812 3456 7890"></div>
        </div>
        <div class="frow2">
          <div class="fld"><label data-i18n="bkSvc"></label>
            <select id="fSvc">
              <option value="svc1" data-i18n="svc1"></option>
              <option value="svc2" data-i18n="svc2"></option>
              <option value="svc3" data-i18n="svc3"></option>
              <option value="svc4" data-i18n="svc4"></option>
              <option value="svc5" data-i18n="svc5"></option>
            </select>
          </div>
          <div class="fld"><label data-i18n="bkItem"></label><input id="fItem" data-i18n-ph="phItem"></div>
        </div>
        <div class="frow2">
          <div class="fld"><label data-i18n="bkDate"></label><input id="fDate" type="date"></div>

/* ===================== TOAST ===================== */
let toastTimer;
function toast(msg){
  $("#toastMsg").textContent=msg;
  const el=$("#toast"); el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),3200);
}

/* ===================== I18N ===================== */
const LANG_NAMES={id:"Bahasa Indonesia",en:"English",zh:"中文",ko:"한국어"};
function buildLangMenus(){
  $("#langMenu").innerHTML=Object.keys(LANG_NAMES).map(l=>
    `<button data-l="${l}" class="${l===lang?'on':''}">${LANG_NAMES[l]}<i data-lucide="check" class="ic-s" style="visibility:${l===lang?'visible':'hidden'}"></i></button>`).join("");
  $("#drawerLang").innerHTML=Object.keys(LANG_NAMES).map(l=>
    `<button data-l="${l}" class="${l===lang?'on':''}">${LANG_NAMES[l]}</button>`).join("");
  $$("#langMenu button").forEach(b=>b.onclick=()=>{setLang(b.dataset.l);$("#langMenu").classList.remove("open");});
  $$("#drawerLang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  refreshIcons();
}
function applyI18n(){
  document.documentElement.lang=lang;
  $$("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $$("[data-i18n-title]").forEach(el=>el.title=t(el.dataset.i18nTitle));
  $("#langCur").textContent=lang.toUpperCase();
  buildLangMenus();
}
function setLang(l){
  if(l===lang) return;
  lang=l; applyI18n(); renderDest(); renderPkg(); renderStays(); renderFaq(); renderChips();
  closeModal();
  toast(t("tLang").replace("{x}",LANG_NAMES[l]));
}

/* ===================== DESTINASI ===================== */
const CAT_ICON={sea:"waves",land:"trees",mount:"mountain"};
const CAT_KEY={sea:"tabSea",land:"tabLand",mount:"tabMount"};
function renderDest(){
  const list=DEST.filter(d=>activeFilter==="all"||d.cat===activeFilter);
  const heights=[300,210,250,190];
  $("#dgrid").innerHTML=list.map((d,i)=>{
    const h=window.innerWidth<=640?230:heights[i%heights.length];
    return `<article class="dcard" data-id="${d.id}">
      <figure style="height:${h}px"><img loading="lazy" src="https://picsum.photos/seed/${d.seed}/800/620.jpg" alt="${d.name}">
        <span class="cat"><i data-lucide="${CAT_ICON[d.cat]}"></i>${t(CAT_KEY[d.cat])}</span></figure>
      <div class="dbody">
        <span class="darea"><i data-lucide="map-pin"></i>${L(d.area)}</span>
        <h3>${d.name}</h3>
        <p>${L(d.desc)}</p>
        <span class="dmore">${t("cardDetail")} <i data-lucide="arrow-up-right"></i></span>
      </div></article>`;
  }).join("");
  refreshIcons();
  $$("#dgrid .dcard").forEach(c=>c.addEventListener("click",()=>openDest(c.dataset.id)));
}
 $$("#tabs .tab").forEach(b=>b.addEventListener("click",()=>{
  activeFilter=b.dataset.f;
  $$("#tabs .tab").forEach(x=>x.classList.toggle("on",x===b));
  renderDest();
}));

/* Modal destinasi */
let curDest=null;
function openDest(id){
  const d=DEST.find(x=>x.id===id); if(!d) return;
  curDest=d;
  $("#mImg").src=`https://picsum.photos/seed/${d.seed}-wide/1000/560.jpg`;
  $("#mArea").innerHTML=`<i data-lucide="map-pin" class="ic-s"></i>${L(d.area)} · ${t(CAT_KEY[d.cat])}`;
  $("#mName").textContent=d.name;
  $("#mDesc").textContent=L(d.desc);
  $("#mSpots").innerHTML=d.spots.map(s=>`<span class="spot"><i data-lucide="check"></i>${s}</span>`).join("");
  $("#modal").classList.add("open"); document.body.style.overflow="hidden";
  refreshIcons();
}
function closeModal(){$("#modal").classList.remove("open");document.body.style.overflow="";}
 $("#mCloseX").onclick=closeModal; $("#mClose2").onclick=closeModal; $("#modalBg").onclick=closeModal;

      <div class="phead">
        <span class="pnum">0${i+1}</span>
        <span><div class="pname">${L(p.name)}</div><div class="pmeta">${t(p.dur)}</div></span>
        <span class="pprice"><b>${p.price}</b><span>${t("pPer")}</span></span>
        <span class="pchev"><i data-lucide="plus"></i></span>
      </div>
      <div class="pbody"><div><div class="pinner">
        <div>
          <div class="itin-t">${t("pItin")}</div>
          <ol class="itin">${L(p.itin).map((s,j)=>`<li><span class="n">${j+1}</span>${s}</li>`).join("")}</ol>
        </div>
        <div class="incl-box">
          <div class="row"><i data-lucide="check"></i><span><strong>${t("pIncl")}:</strong><br>${L(p.incl)}</span></div>
          <div class="row"><i data-lucide="users"></i><span>${t("pkgSub")}</span></div>
          <button class="btn terra" data-book="${i}"><i data-lucide="message-circle" class="ic-m"></i>${t("pBook")}</button>
        </div>
      </div></div></div>
    </div>`).join("");
  refreshIcons();
  $$("#plist .phead").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("open")));
  $$("#plist [data-book]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const p=PKG[+b.dataset.book];
    $("#fSvc").value="svc1"; $("#fItem").value=L(p.name);
    document.getElementById("booking").scrollIntoView({behavior:"smooth"});
    const f=$("#bkForm"); f.classList.remove("flash"); void f.offsetWidth; f.classList.add("flash");
    toast(t("bkAuto").replace("{x}",L(p.name)));
  }));
}

      </div>
    </div>

    <div class="stay-sm">
      <figure><img loading="lazy" src="https://picsum.photos/seed/${s.seed}/300/300.jpg" alt="${s.name}"></figure>
      <div style="flex:1">
        <h4>${s.name}</h4>
        <span class="darea"><i data-lucide="map-pin"></i>${L(s.area)}</span>

        <div class="stay-foot">
          <span class="price"><b>${s.price}</b><span>${t("perNight")}</span></span>

    const s=STAY.find(x=>x.id===b.dataset.stay);
    $("#fSvc").value="svc2"; $("#fItem").value=s.name;
    document.getElementById("booking").scrollIntoView({behavior:"smooth"});
    const f=$("#bkForm"); f.classList.remove("flash"); void f.offsetWidth; f.classList.add("flash");

  }));
}

/* ===================== CHAT AI (SIMULASI LOKAL) ===================== */
function pushMsg(who,text){
  const b=$("#cbody"), el=document.createElement("div");
  el.className="msg "+who; el.textContent=text; b.appendChild(el);
  b.scrollTop=b.scrollHeight; return el;
}
function botSay(text,delay){
  const b=$("#cbody"), ty=document.createElement("div");
  ty.className="msg bot typing"; ty.innerHTML="<i></i><i></i><i></i>";
  setTimeout(()=>{b.appendChild(ty);b.scrollTop=b.scrollHeight;},150);
  setTimeout(()=>{ty.remove();pushMsg("bot",text);},delay);
}
function hit(txt,w){
  if(/^[a-z]{1,4}$/i.test(w)) return new RegExp("\\b"+w+"\\b","i").test(txt);
  return txt.includes(w);
}
const INTENTS=[
 ["ai_thx",["terima kasih","makasih","thank","감사","고마","谢谢","多谢"]],
 ["ai_hours",["jam","buka","tutup","open","hour","时间","几点","운영","시간"]],
 ["ai_pay",["bayar","payment","dp","cash","transfer","lunas","支付","付款","결제","지불"]],
 ["ai_air",["bandara","jemput","airport","pickup","pick up","接机","机场","공항","픽업"]],
 ["ai_hot",["hotel","villa","penginapan","stay","inn","homestay","酒店","住宿","숙소","호텔"]],
 ["ai_lem",["lembongan","penida","nusa","蓝梦","佩尼达","렘본간","페니다"]],
 ["ai_book",["book","booking","reserv","pesan","daftar","预约","预订","예약"]],
 ["ai_pack",["paket","tour","package","price","harga","biaya","trip","价","费用","패키지","투어","가격","비용"]],
 ["ai_greet",["halo","hallo","hai","hi","hello","hey","안녕","你好","您好"]],
];
function aiReply(text){
  const s=text.toLowerCase();
  for(const [key,words] of INTENTS){
    if(words.some(w=>hit(s,w))) return t(key);
  }
  return t("ai_def");
}
function sendChat(text){
  if(!text.trim()) return;
  pushMsg("me",text); $("#cInput").value="";
  botSay(aiReply(text), 650+Math.random()*500);
}
function renderChips(){
  $("#chipsRow").innerHTML=["chip1","chip2","chip3"].map(k=>`<button class="qchip" data-c="${k}">${t(k)}</button>`).join("");
  $$("#chipsRow .qchip").forEach(c=>c.onclick=()=>sendChat(t(c.dataset.c)));
}
 $("#fab").addEventListener("click",()=>{
  const p=$("#cpanel"); p.classList.toggle("open");
  if(p.classList.contains("open")&&!chatStarted){
    chatStarted=true; botSay(t("cHello"),350);
    setTimeout(()=>{const b=$("#cbody");b.scrollTop=b.scrollHeight;},1200);
  }
});
 $("#cSend").onclick=()=>sendChat($("#cInput").value);
 $("#cInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat($("#cInput").value);});
 $("#chatWa").addEventListener("click",e=>{e.preventDefault();window.open(waLink(t("ai_wa")),"_blank");});

/* ===================== REVEAL ON SCROLL ===================== */
const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}
}),{threshold:.12});
 $$(".rv").forEach(el=>io.observe(el));
